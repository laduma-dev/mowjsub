input-image:
  info: Input image
  dtype: File
  must_exist: yes
  required: yes
  policies:
    positional: yes
output-prefix:
  info: Name of ouput image
  dtype: str
mask-image:
  info: Mask image
  dtype: File
  must_exist: true
sigma-clip:
  info: Sigma clip for each iteration. Only required if mask-image is not given.
  dtype: List[float]
  policies:
    repeat: "[]"
automask-per-iter:
  info: Generate a new mask per iteration.
  dtype: bool
  default: False
fit-model:
  info: "Fit function to model the continuum. The 'scipy-median-filter' model is much faster than 'median-filter', but treats band edges and masked channels differently, so the two do not give identical continuum models. WARNING: A median-filter continuum model may subsume low SNR line emission, use it with great care."
  dtype: str
  choices:
    - b-spline
    - spline
    - polynomial
    - median-filter
    - scipy-median-filter
    - gcv-spline
  default: b-spline
order:
  info: Order of spline/polynomial or number of top coefficients to use for DCT reconstruction
  dtype: int
vel-width: 
  info: Width of spline segments or median filter window in km/s.
  dtype: float
chan-width:
  info: Width of spline segments or median filter window in number of channels.
  dtype: int
gcv-lambda:
  info: GCV spline penalty. Zero is equivalent to an interpolating spline, high values lead to a flatter curve. If unset the parameter will be estimated using the GCV criterion; this can be very slow. Experience suggests that values chanwidth/nchan work best.
  dtype: float
segments: 
  info: "## This has been replaced by --vel-width. It will be removed in future releases ## Width of spline segments or median filter window in km/s. If given as a list, then it must have same size as --order."
  dtype: float
cont-fit-tol:
  info: "Minimum percentage of valid spectrum data points required to do a fit.
        Spectra below this tolerance will be set to NaN.
        Leaving this unset may result in poor or NaN spectra in the output cubes"
  dtype: float
  default: 0
overwrite:
  info: Overwrite output image if it already exists
  dtype: bool
  default: yes
stokes-index:
  info: "Index of stokes channel (zero-based) to use."
  dtype: int
  default: 0
rest-freq:
  info: Cube rest frequency in MHz. Will ignore the one in the FITS header if it exists.
  dtype: float
stokes-axis:
  info: "### DEPRECATED #### Set this flag if the input image has a stokes dimension. (Default is True)."
  default: yes
  dtype: bool
hdu-index:
  info: FITS primary HDU index
  dtype: int
  default: 0
  abbreviation: hi
ra-chunks:
  info: Chunking along RA-axis. If set to zero, no Chunking is perfomed.
  dtype: int 
  default: 64
nworkers:
  info: "Number of parallel worker threads (roughly one per CPU core). Runtime for fitting-bound models scales with this, so raise it to speed up large cubes."
  dtype: int
  default: 4
loglevel:
  info: Log level for the output
  dtype: str
  default: info
  choices:
    - info
    - debug
    - trace
    - error
    - critical
doppler-frame:
  info: "Spectral reference frame to Doppler-correct the output cubes to, applied after the continuum fit. A cube has already been integrated over time, so only a single correction factor can be applied: this is safe only when the line-of-sight velocity drifts by much less than one channel over the observation, and cannot undo smearing from a larger drift. Pass --doppler-obs-duration to have that checked. For long tracks, correct in the visibility plane instead (doppler-mowjsub). Leave unset to skip Doppler correction."
  dtype: str
  choices:
    - topo
    - geo
    - bary
    - lsrk
    - lsrd
    - galacto
    - lgroup
    - cmb
    - source
doppler-chan-grid:
  info: "Output channel grid for the Doppler correction. 'auto' derives it from this cube, dropping one guard channel at each end. Otherwise give 'nchan,chan0,chanwidth' with frequency units, e.g. '1000,1419.5MHz,26.1kHz'; use this to place several observations on one common grid for stacking."
  dtype: str
  default: auto
doppler-interpolation:
  info: "Interpolation used when resampling onto the Doppler-corrected grid. 'nearest' leaves channel noise uncorrelated; 'linear' is smoother but correlates adjacent channels."
  dtype: str
  choices:
    - nearest
    - linear
  default: nearest
doppler-source-vel:
  info: "Systemic radial velocity of the source in km/s, positive for recession. Required with --doppler-frame=source, since a cube carries no SOURCE::SYSVEL to fall back on."
  dtype: float
doppler-time:
  info: "Observation epoch for the Doppler correction, as an ISO date or an MJD. Overrides the cube's MJD-OBS or DATE-OBS."
  dtype: str
doppler-obs-duration:
  info: "Length of the observation in hours. Only used to check how far the line-of-sight velocity drifted over the track, and to take the correction at the midpoint rather than the start. Nothing standard records this in a FITS header, so it must be given; without it the drift check is skipped."
  dtype: float
doppler-telescope:
  info: "Observatory name, resolved through astropy's site registry. Overrides the cube's OBSGEO-X/Y/Z or TELESCOP keywords, and is needed when the header carries neither."
  dtype: str
doppler-phase-centre:
  info: "Field centre used to project the observatory velocity, as 'RA,Dec' in degrees or sexagesimal. Overrides the cube's WCS reference coordinate."
  dtype: str
