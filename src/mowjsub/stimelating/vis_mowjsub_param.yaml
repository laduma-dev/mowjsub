ms:
      info: Input MS file
      dtype: File
      must_exist: yes
      required: yes
      policies:
        positional: true
input-column:
      info: Column which contains the data to be continuum subtracted.
      dtype: str
      default: DATA 
output-column:
      info: "Column name to write the continuum subtracted data to. Required: there is no standard MS column for continuum-subtracted visibilities, so naming one is left to you. Pass DATA if the imager you feed the result to expects that column -- but note that without --output-ms this writes back into the input MS, so it must differ from --input-column."
      dtype: str
      required: yes
fit-model:
      info: "Fit function to model the continuum. The 'scipy-median-filter' model is much faster than 'median-filter', but treats band edges and masked channels differently, so the two do not give identical continuum models. WARNING: A median-filter continuum model may subsume low SNR line emission, use it with great care."
      dtype: str
      choices:
          - b-spline
          - spline
          - polynomial
          - median-filter
          - scipy-median-filter
          - gcv-spline
      default: b-spline
order:
      info: Order of spline/polynomial or number of top coefficients to use for DCT reconstruction
      dtype: int
vel-width: 
      info: Width of spline segments or median filter window in km/s.
      dtype: float
chan-width:
      info: Width of spline segments or median filter window in number of channels.
      dtype: int
gcv-lambda:
      info: GCV spline penalty. Zero is equivalent to an interpolating spline, high values lead to a flatter curve. If unset the parameter will be estimated using the GCV criterion; this can be very slow. Experience suggests that values chanwidth/nchan work best.
      dtype: float
segments: 
      info: "## This has been replaced by --vel-width. It will be removed in future releases ## Width of spline segments or median filter window in km/s. If given as a list, then it must have same size as --order."
      dtype: float
spwid:
      info: Spectral Window ID
      dtype: int
      default: 0
field-id:
      info: Field ID 
      dtype: int
      default: 0
row-chunks: 
      info: Chunking strategy (Done along the time axis)
      dtype: int
      default: 10000
time-chunks:
      info: Chunk size for time axis
      dtype: int
      default: 64
bl-chunks:
      info: Chunk size for baseline axis
      dtype: int
      default: 10
cont-fit-tol:
      info: "Minimum percentage of valid spectrum data points required to do a fit.
            If the percentage of data points is below this percentage, original data will be returned."
      dtype: float
      default: 0
nworkers:
      info: "Number of parallel worker threads (roughly one per CPU core). Runtime for fitting-bound models scales with this, so raise it to speed up large datasets."
      dtype: int
      default: 4
output-ms:
      info: If provided, write the output to a new MS with this name. Otherwise, add new column to the input MS.
      dtype: File
      required: False
load-from-cache:
      info: Load the MS from a cache (give Zarr file name) if available, otherwise create it.
      dtype: File
      required: False
doppler-frame:
      info: "Spectral reference frame to Doppler-correct the output to. When set, the continuum-subtracted visibilities are resampled onto a channel grid fixed in this frame, as CASA mstransform does with regridms=True. The continuum is always fitted on the native topocentric grid first, so the fit sees the bandpass structure where it is stationary. Requires output-ms, since the output channel grid differs from the input. Leave unset to skip Doppler correction."
      dtype: str
      choices:
          - topo
          - geo
          - bary
          - lsrk
          - lsrd
          - galacto
          - lgroup
          - cmb
          - source
doppler-chan-grid:
      info: "Output channel grid for the Doppler correction. 'auto' derives the grid that every timestamp of this observation covers. Otherwise give 'nchan,chan0,chanwidth' with frequency units, e.g. '1000,1419.5MHz,26.1kHz'; use this to place several MSs on one common grid, since 'auto' only ever sees a single MS."
      dtype: str
      default: auto
doppler-interpolation:
      info: "Interpolation used when resampling onto the Doppler-corrected grid. 'nearest' is what caracal asks of CASA mstransform and leaves channel noise uncorrelated; 'linear' is smoother but correlates adjacent channels."
      dtype: str
      choices:
          - nearest
          - linear
      default: nearest
doppler-source-vel:
      info: "Systemic radial velocity of the source in km/s, positive for recession. Only used with doppler-frame=source; when unset it is read from the MS SOURCE::SYSVEL column."
      dtype: float