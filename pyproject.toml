[project]
name = "mowjsub"
version = "2.0rc2"
description = "Radio astronomy data continuum subtraction tools"
authors = [
	{ name = "Sphesihle Makhathini" },
	{ name = "Mika Naidoo" },
	{ name = "Amir Kazemi-Moridani" },
]
requires-python = ">=3.11,<3.14"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
	"numpy",
	"astropy",
	"scipy",
	"xarray-fits",
	"xarray",
	"scabha>=2.2.0rc2",
	"zarr",
	"tqdm",
	"dask-ms",
	"dask",
]


[tool.hatch.build.targets.sdist]
include = [
    "/src/mowjsub",
    "/README.rst",
    "/LICENSE",
    "/CHANGES.md",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mowjsub"]

[project.scripts]
im-mowjsub = "mowjsub.parser.im_mowjsub:runit"
vis-mowjsub = "mowjsub.parser.vis_mowjsub:runit"

[dependency-groups]
# Everything needed to develop and test. `dev` is uv's default group, so a plain
# `uv sync` gets it and `uv run pytest`/`uv run ruff` just work. There used to be
# a separate `tests` group holding pytest+ruff; it only ever added a way to get a
# venv where `uv run pytest` fell through to a system pytest that cannot import
# scabha. No `pre-commit` here either -- the hook is `.githooks/pre-commit`,
# enabled with `git config core.hooksPath .githooks`, and it uses this group's
# ruff rather than fetching its own.
dev = [
    "ruff>=0.12.9",
    # >=9.0.3 for GHSA-6w46-j5rx-g56g (tmpdir handling). A floor rather than an
    # exact pin, so a future advisory fix does not need a pyproject edit.
    "pytest>=9.0.3,<10",
#	"jupyter",
#	"matplotlib",
]

# Documentation build (Sphinx + Furo). `uv sync --group docs`.
docs = [
	"Sphinx>=8.1,<9",
	"sphinx-copybutton",
	"furo",
	"sphinx-rtd-theme",
	"sphinx_click==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
python_files = ["*_tests.py", "test_*.py"]
testpaths = ["tests"]
pythonpath = ["src"]
