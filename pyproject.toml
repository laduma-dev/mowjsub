[project]
name = "mowjsub"
version = "2.0.1"
description = "Radio astronomy data continuum subtraction tools"
authors = [
	{ name = "Sphesihle Makhathini" },
	{ name = "Mika Naidoo" },
	{ name = "Amir Kazemi-Moridani" },
]
requires-python = ">=3.11,<3.14"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
	"numpy",
	"astropy",
	"scipy",
	"xarray",
	"click>=8.1",
	"pydantic>=2.6",
	"zarr",
	"tqdm",
	"dask-ms",
	"dask",
	# The FITS reader. `>=0.2.1` for `FitsData(hdu=...)`, which is what lets
	# `--hdu-index` keep working.
	"fitstoolz>=0.2.1",
]


# Development-only source: merged fitstoolz#30 makes Stimela optional.
# Remove this override after a fixed PyPI release and raise the dependency floor.
# Built wheels retain fitstoolz>=0.2.1 and resolve published dependencies.
[tool.uv.sources]
fitstoolz = { url = "https://github.com/shinobi-dosho/fitstoolz/archive/6a4627c5687c49f66b2e2c298bdde2193f524b6e.tar.gz" }

[project.optional-dependencies]
ninja = ["stimela-ninja>=0.1.0b5"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mowjsub",
    "/README.rst",
    "/LICENSE",
    "/CHANGES.md",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mowjsub"]

[project.scripts]
im-mowjsub = "mowjsub.parser.im_mowjsub:command"
vis-mowjsub = "mowjsub.parser.vis_mowjsub:command"
doppler-mowjsub = "mowjsub.parser.doppler_mowjsub:command"

[dependency-groups]
# Everything needed to develop and test. `dev` is uv's default group, so a plain
# `uv sync` gets it and `uv run pytest`/`uv run ruff` just work. There used to be
# a separate `tests` group holding pytest+ruff; it only ever added a way to get a
# venv where `uv run pytest` fell through to a system pytest that cannot import
# scabha. No `pre-commit` here either -- the hook is `.githooks/pre-commit`,
# enabled with `git config core.hooksPath .githooks`, and it uses this group's
# ruff rather than fetching its own.
dev = [
    "ruff>=0.12.9",
    # >=9.0.3 for GHSA-6w46-j5rx-g56g (tmpdir handling). A floor rather than an
    # exact pin, so a future advisory fix does not need a pyproject edit.
    "pytest>=9.0.3,<10",
#	"jupyter",
#	"matplotlib",
]

# Documentation build (Sphinx + Furo). `uv sync --group docs`.
docs = [
	"Sphinx>=8.1,<9",
	"sphinx-copybutton",
	"furo",
	"sphinx-rtd-theme",
	"sphinx_click==6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
python_files = ["*_tests.py", "test_*.py"]
testpaths = ["tests"]
pythonpath = ["src"]
