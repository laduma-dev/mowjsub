on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: uv sync --group dev
    - name: Lint with ruff
      run: uv run ruff check src/mowjsub/
    - name: CI tests
      run: uv run pytest
    # uv.lock is untracked, so Dependabot only ever sees pyproject.toml's loose
    # constraints and cannot alert on the transitive tree. This is the check that
    # actually covers it. Runs per matrix entry because resolution differs by
    # Python version.
    - name: Audit dependencies
      run: uv run --with pip-audit python -m pip_audit --progress-spinner off --skip-editable
