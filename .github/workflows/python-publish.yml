name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    # Only version tags with the project's leading v publish packages.
    if: startsWith(github.event.release.tag_name, 'v')

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'
    - name: Build package
      run: uv build
    - name: Publish to PyPI
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_MOWJSUB }}
