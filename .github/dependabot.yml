# Dependabot configuration. Not an Actions workflow -- GitHub reads this file
# directly; there is nothing in .github/workflows/ driving it.
#
# The `uv` ecosystem below only does anything useful because uv.lock is tracked
# (efecb41). While the lock was gitignored, Dependabot could see nothing but the
# loose constraints in pyproject.toml, which is how 73 alerts ended up pinned to
# a lockfile snapshot it could no longer re-evaluate.
#
# Dependabot updates pyproject.toml and uv.lock together, so its PRs satisfy
# CI's `uv sync --locked` check rather than tripping it.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # ruff and pytest churn often and cannot affect what users get, so one
      # PR for the lot. Note a ruff bump is not risk-free even so: the ruleset
      # is pinned in ruff.toml precisely because 0.16 widened ruff's defaults.
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
      # Routine runtime bumps, batched to keep the queue readable.
      runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Deliberately no group for runtime *major* bumps: astropy, dask, dask-ms,
      # xarray and casacore majors are exactly the changes that deserve their own
      # PR and their own test run, not a batch someone merges on green.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
